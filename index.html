<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eurotrip 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eurotrip 2026">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23e85d26'/%3E%3Ctext x='90' y='125' text-anchor='middle' font-size='110' fill='white'%3E✈%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f5f3ef;
  --bg2: #ffffff;
  --fg: #1a1a1a;
  --fg2: #555;
  --accent: #e85d26;
  --accent2: #d14b17;
  --border: #e0ddd8;
  --tag-bg: #f0ece6;
  --check-bg: #e8f5e9;
  --check-fg: #2e7d32;
  --nav-bg: #fffdf9;
  --card-shadow: 0 1px 3px rgba(0,0,0,.06);
  --city-madrid: #e85d26;
  --city-barcelona: #c2185b;
  --city-paris: #1565c0;
  --city-brussels: #f9a825;
  --city-amsterdam: #e65100;
  --city-roma: #6a1b9a;
  --city-dublin: #2e7d32;
  --city-edinburgh: #0277bd;
  --city-lisboa: #00838f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212;
    --bg2: #1e1e1e;
    --fg: #e8e6e1;
    --fg2: #999;
    --accent: #ff7a45;
    --accent2: #ff9a6c;
    --border: #333;
    --tag-bg: #2a2722;
    --check-bg: #1b3a1e;
    --check-fg: #66bb6a;
    --nav-bg: #181818;
    --card-shadow: 0 1px 3px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212;
  --bg2: #1e1e1e;
  --fg: #e8e6e1;
  --fg2: #999;
  --accent: #ff7a45;
  --accent2: #ff9a6c;
  --border: #333;
  --tag-bg: #2a2722;
  --check-bg: #1b3a1e;
  --check-fg: #66bb6a;
  --nav-bg: #181818;
  --card-shadow: 0 1px 3px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(72px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--nav-bg);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: stretch;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 100;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 8px 4px 6px; border: none; background: none;
  color: var(--fg2); font-size: 10px; font-family: 'Inter', sans-serif;
  cursor: pointer; transition: color .15s;
}
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 22px; height: 22px; }

/* SECTIONS */
.section { display: none; padding-block: 16px 24px; }
.section.active { display: block; }
.section-title {
  font-size: 22px; font-weight: 700; margin-bottom: 16px;
  text-wrap: balance;
}

/* HOME */
.hero {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; border-radius: 16px; padding: 28px 20px;
  margin-bottom: 20px; text-align: center;
}
.hero h1 { font-size: 26px; margin-bottom: 4px; }
.hero .subtitle { font-size: 14px; opacity: .85; margin-bottom: 20px; }
.countdown { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.cd-item { text-align: center; }
.cd-num { font-size: 32px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
.cd-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; opacity: .8; }

.route-strip {
  display: flex; gap: 0; overflow-x: auto; padding: 12px 0;
  -webkit-overflow-scrolling: touch;
}
.route-strip::-webkit-scrollbar { display: none; }
.route-city {
  display: flex; flex-direction: column; align-items: center;
  min-width: 72px; position: relative;
}
.route-dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid var(--accent); background: var(--bg);
}
.route-city.visited .route-dot { background: var(--accent); }
.route-line {
  position: absolute; top: 5px; left: calc(50% + 6px);
  width: calc(100% - 12px); height: 2px; background: var(--border);
}
.route-city:last-child .route-line { display: none; }
.route-name { font-size: 11px; margin-top: 6px; font-weight: 500; color: var(--fg2); }
.route-dates { font-size: 10px; color: var(--fg2); opacity: .7; }

.stats-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  margin-top: 16px;
}
.stat-card {
  background: var(--bg2); border-radius: 12px; padding: 14px;
  text-align: center; border: 1px solid var(--border);
}
.stat-num { font-size: 24px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; color: var(--accent); }
.stat-label { font-size: 11px; color: var(--fg2); margin-top: 2px; }

/* ROTEIRO */
.day-tabs {
  display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 12px;
  -webkit-overflow-scrolling: touch; position: sticky;
  top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 50;
}
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab {
  flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 500; border: 1px solid var(--border);
  background: var(--bg2); color: var(--fg2); cursor: pointer;
  white-space: nowrap; transition: all .15s;
}
.day-tab.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.day-content { display: none; }
.day-content.active { display: block; }
.day-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
}
.day-badge {
  display: inline-block; padding: 3px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 600; color: #fff;
  text-transform: uppercase; letter-spacing: .03em;
}
.day-title { font-size: 18px; font-weight: 600; }

.activity {
  background: var(--bg2); border-radius: 12px; padding: 12px 14px;
  margin-bottom: 8px; border: 1px solid var(--border);
  display: flex; gap: 10px; align-items: flex-start;
  transition: background .15s;
}
.activity.checked { background: var(--check-bg); border-color: var(--check-fg); opacity: .75; }
.activity-check {
  flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px;
  border: 2px solid var(--border); background: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  margin-top: 1px; transition: all .15s; color: transparent;
}
.activity.checked .activity-check {
  background: var(--check-fg); border-color: var(--check-fg); color: #fff;
}
.activity-body { flex: 1; min-width: 0; }
.activity-time {
  font-size: 12px; font-weight: 600; color: var(--accent);
  font-family: 'Space Grotesk', sans-serif;
}
.activity-name { font-weight: 500; }
.activity-desc { font-size: 13px; color: var(--fg2); margin-top: 2px; }
.activity-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.map-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--accent); font-weight: 500;
  padding: 3px 8px; border-radius: 6px; background: var(--tag-bg);
}
.alert-box {
  background: var(--tag-bg); border-radius: 10px; padding: 10px 14px;
  margin-bottom: 8px; font-size: 13px; color: var(--fg2);
  border-left: 3px solid var(--accent);
}
.hotel-card {
  background: var(--bg2); border-radius: 12px; padding: 14px;
  margin-bottom: 12px; border: 1px solid var(--border);
}
.hotel-card h4 { font-size: 14px; margin-bottom: 4px; }
.hotel-card p { font-size: 13px; color: var(--fg2); }

/* DOCS */
.doc-group { margin-bottom: 20px; }
.doc-group h3 { font-size: 16px; margin-bottom: 8px; }
.doc-item {
  background: var(--bg2); border-radius: 10px; padding: 12px 14px;
  margin-bottom: 6px; border: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.doc-icon { font-size: 20px; flex-shrink: 0; }
.doc-info { flex: 1; min-width: 0; }
.doc-info .name { font-weight: 500; font-size: 14px; }
.doc-info .status { font-size: 12px; color: var(--fg2); }

/* FINANCEIRO */
.fin-summary {
  background: var(--bg2); border-radius: 12px; padding: 16px;
  margin-bottom: 16px; border: 1px solid var(--border);
}
.person-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.person-row:last-child { border-bottom: none; }
.person-name { font-weight: 500; }
.person-status { font-size: 13px; font-weight: 600; }
.person-status.ok { color: var(--check-fg); }
.person-status.pending { color: var(--accent); }

/* CITY INFO */
.city-card {
  background: var(--bg2); border-radius: 12px; padding: 16px;
  margin-bottom: 12px; border: 1px solid var(--border);
}
.city-card h3 {
  font-size: 16px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.city-flag { font-size: 22px; }
.info-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.info-item { font-size: 13px; }
.info-label { color: var(--fg2); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }

/* CHECKLIST */
.checklist-group { margin-bottom: 20px; }
.checklist-group h3 { font-size: 16px; margin-bottom: 8px; }
.check-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--bg2); border-radius: 10px;
  margin-bottom: 6px; border: 1px solid var(--border); cursor: pointer;
}
.check-item.done { opacity: .6; text-decoration: line-through; }
.check-box {
  width: 20px; height: 20px; border-radius: 5px;
  border: 2px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: transparent; transition: all .15s;
}
.check-item.done .check-box {
  background: var(--check-fg); border-color: var(--check-fg); color: #fff;
}
.check-text { font-size: 14px; }

/* SEARCH */
.search-box {
  width: 100%; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg2);
  color: var(--fg); font-size: 14px; font-family: inherit;
  margin-bottom: 12px;
}
.search-box::placeholder { color: var(--fg2); }
.search-box:focus { outline: 2px solid var(--accent); border-color: transparent; }
</style>
</head>

// ── STORAGE ──
function loadState(key, def) {
  try { const v = localStorage.getItem('et26_'+key); return v ? JSON.parse(v) : def; } catch(e) { return def; }
}
function saveState(key, val) {
  try { localStorage.setItem('et26_'+key, JSON.stringify(val)); } catch(e) {}
}

// ── COUNTDOWN ──
function updateCountdown() {
  const now = new Date();
  const start = new Date('2026-11-14T06:30:00-03:00');
  const diff = start - now;
  const el = document.getElementById('countdown');
  if (diff <= 0) { el.innerHTML = '<div class="cd-item"><div class="cd-num">🎉</div><div class="cd-label">Boa viagem!</div></div>'; return; }
  const d = Math.floor(diff / 864e5);
  const h = Math.floor((diff % 864e5) / 36e5);
  const m = Math.floor((diff % 36e5) / 6e4);
  el.innerHTML = `<div class="cd-item"><div class="cd-num">${d}</div><div class="cd-label">dias</div></div><div class="cd-item"><div class="cd-num">${h}</div><div class="cd-label">horas</div></div><div class="cd-item"><div class="cd-num">${m}</div><div class="cd-label">min</div></div>`;
}

// ── ROUTE STRIP ──
function renderRoute() {
  const el = document.getElementById('route-strip');
  el.innerHTML = TRIP_DATA.cities.map((c, i) =>
    `<div class="route-city"><div class="route-line"></div><div class="route-dot" style="border-color:${c.color}"></div><div class="route-name">${c.name}</div><div class="route-dates">${c.dates}</div></div>`
  ).join('');
}

// ── ROTEIRO ──
let checkedActivities = loadState('checks', {});

function renderDayTabs() {
  const tabs = document.getElementById('day-tabs');
  const contents = document.getElementById('day-contents');
  tabs.innerHTML = TRIP_DATA.days.map((d, i) =>
    `<button class="day-tab${i===0?' active':''}" data-idx="${i}">${d.date}<br><span style="font-size:10px;opacity:.7">${d.dow}</span></button>`
  ).join('');
  contents.innerHTML = TRIP_DATA.days.map((d, i) => renderDay(d, i)).join('');
  tabs.querySelectorAll('.day-tab').forEach(btn => {
    btn.onclick = () => {
      tabs.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      contents.querySelectorAll('.day-content').forEach(c => c.classList.remove('active'));
      document.getElementById('day-'+d_idx(btn)).classList.add('active');
      btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    };
  });
}
function d_idx(btn) { return btn.dataset.idx; }

function renderDay(day, idx) {
  let html = `<div class="day-content${idx===0?' active':''}" id="day-${idx}">`;
  html += `<div class="day-header"><span class="day-badge" style="background:${day.color}">${day.city}</span><span class="day-title">${day.title}</span></div>`;
  if (day.hotel) {
    html += `<div class="hotel-card"><h4>🏨 ${day.hotel.name}</h4><p>${day.hotel.address}</p><p>Check-in ${day.hotel.checkin} · Check-out ${day.hotel.checkout}</p>${day.hotel.maps?`<a class="map-link" href="${day.hotel.maps}" target="_blank" rel="noopener">📍 Maps</a>`:''}</div>`;
  }
  day.alerts.forEach(a => { html += `<div class="alert-box">⚠️ ${a}</div>`; });
  day.activities.forEach((act, ai) => {
    const key = day.id + '_' + ai;
    const ck = checkedActivities[key] ? ' checked' : '';
    html += `<div class="activity${ck}" data-key="${key}">`;
    html += `<button class="activity-check" onclick="toggleCheck('${key}', this)">✓</button>`;
    html += `<div class="activity-body">`;
    if (act.time) html += `<div class="activity-time">${act.time}</div>`;
    html += `<div class="activity-name">${act.name}</div>`;
    if (act.desc) html += `<div class="activity-desc">${act.desc}</div>`;
    if (act.maps) html += `<div class="activity-links"><a class="map-link" href="${act.maps}" target="_blank" rel="noopener">📍 Maps</a></div>`;
    html += `</div></div>`;
  });
  html += `</div>`;
  return html;
}

function toggleCheck(key, btn) {
  checkedActivities[key] = !checkedActivities[key];
  saveState('checks', checkedActivities);
  const card = btn.closest('.activity');
  card.classList.toggle('checked', checkedActivities[key]);
}

// ── SEARCH ──
document.getElementById('search-roteiro').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  const contents = document.getElementById('day-contents');
  if (!q) {
    contents.querySelectorAll('.activity').forEach(a => a.style.display = '');
    contents.querySelectorAll('.day-content').forEach(d => d.style.display = '');
    return;
  }
  TRIP_DATA.days.forEach((day, di) => {
    const dayEl = document.getElementById('day-'+di);
    let anyVisible = false;
    dayEl.querySelectorAll('.activity').forEach((act, ai) => {
      const a = day.activities[ai];
      const text = (a.name + ' ' + a.desc + ' ' + (a.time||'')).toLowerCase();
      const match = text.includes(q);
      act.style.display = match ? '' : 'none';
      if (match) anyVisible = true;
    });
    dayEl.style.display = anyVisible ? 'block' : 'none';
    if (anyVisible) dayEl.classList.add('active');
  });
});

// ── DOCS ──
function renderDocs() {
  const el = document.getElementById('docs-list');
  el.innerHTML = TRIP_DATA.docs.map(g => {
    let h = `<div class="doc-group"><h3>${g.icon} ${g.group}</h3>`;
    g.items.forEach(item => {
      const hasLink = item.link && item.link.length > 0;
      h += `<div class="doc-item"><div class="doc-icon">${hasLink ? '✅' : '📄'}</div><div class="doc-info"><div class="name">${hasLink ? `<a href="${item.link}" target="_blank">${item.name}</a>` : item.name}</div><div class="status">${hasLink ? 'Link adicionado' : 'Aguardando link do Google Drive'}</div></div></div>`;
    });
    h += `</div>`;
    return h;
  }).join('');
}

        <div class="info-item"><div class="info-label">Transporte</div>${c.transport}</div>
        <div class="info-item"><div class="info-label">Tomada</div>${c.voltage}</div>

      </div>
    </div>
  `).join('');
}

// ── CHECKLIST ──
let checklistState = loadState('checklist', {});

function renderChecklist() {
  const el = document.getElementById('checklist-content');
  const groups = [
    { key: 'documentos', title: '📄 Documentos', items: TRIP_DATA.checklist.documentos },
    { key: 'eletronicos', title: '🔌 Eletrônicos', items: TRIP_DATA.checklist.eletronicos }
  ];
  el.innerHTML = groups.map(g => {
    let h = `<div class="checklist-group"><h3>${g.title}</h3>`;
    g.items.forEach((item, i) => {
      const k = g.key + '_' + i;
      const done = checklistState[k] ? ' done' : '';
      h += `<div class="check-item${done}" onclick="toggleChecklist('${k}', this)"><div class="check-box">✓</div><span class="check-text">${item}</span></div>`;
    });
    h += `</div>`;
    return h;
  }).join('');
}

function toggleChecklist(key, el) {
  checklistState[key] = !checklistState[key];
  saveState('checklist', checklistState);
  el.classList.toggle('done', checklistState[key]);
}

// ── NAV ──
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('sec-' + btn.dataset.section).classList.add('active');
    window.scrollTo(0, 0);
  };
});

// ── INIT ──
updateCountdown();
setInterval(updateCountdown, 60000);
renderRoute();
renderDayTabs();
renderDocs();
renderCityInfo();
renderChecklist();
